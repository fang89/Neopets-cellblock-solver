<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 304" width="1000" height="304" role="img" aria-label="Win, draw and loss rates"><rect width="1000" height="304" rx="18" fill="#f5f3ff"/><text x="40" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#1e1b4b">How often it wins</text><rect x="640" y="30" width="14" height="14" rx="4" fill="#7c3aed"/><text x="660" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#5b5675">Won</text><rect x="760" y="30" width="14" height="14" rx="4" fill="#c4b5fd"/><text x="780" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#5b5675">Board filled</text><rect x="880" y="30" width="14" height="14" rx="4" fill="#ef4444"/><text x="900" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#5b5675">Lost</text><text x="40" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">From the real opening, vs the prisoner · 1,000 games</text><rect x="40" y="98" width="920" height="30" fill="#7c3aed"/><text x="52" y="119" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">100.0% won · 9 moves every game</text><text x="40" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">Random opening, vs the same prisoner · 1,000 games</text><rect x="40" y="176" width="754.4" height="30" fill="#7c3aed"/><rect x="794.4" y="176" width="160.08" height="30" fill="#c4b5fd"/><rect x="954.48" y="176" width="5.52" height="30" fill="#ef4444"/><text x="52" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">82.0% won</text><text x="40" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e1b4b">Random opening, vs a much stronger opponent · 300 games</text><rect x="40" y="254" width="404.8" height="30" fill="#7c3aed"/><rect x="444.8" y="254" width="472.26666666666665" height="30" fill="#c4b5fd"/><rect x="917.0666666666666" y="254" width="42.93333333333333" height="30" fill="#ef4444"/><text x="52" y="275" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">44.0% won</text></svg>