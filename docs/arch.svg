<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="How the helper works"><rect width="1000" height="230" rx="18" fill="#f5f3ff"/><rect x="20" y="50" width="178" height="96" rx="14" fill="#fff" stroke="#c4b5fd"/><text x="109" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#1e1b4b" text-anchor="middle">Bookmark</text><text x="109" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5b5675" text-anchor="middle">one click on the game page</text><path d="M202 98 h5.5" stroke="#7c3aed" stroke-width="3"/><path d="M205.5 92 l8 6 l-8 6 z" fill="#7c3aed"/><rect x="215.5" y="50" width="178" height="96" rx="14" fill="#fff" stroke="#c4b5fd"/><text x="304.5" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#1e1b4b" text-anchor="middle">Same-site frame</text><text x="304.5" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5b5675" text-anchor="middle">survives every move’s reload</text><path d="M397.5 98 h5.5" stroke="#7c3aed" stroke-width="3"/><path d="M401 92 l8 6 l-8 6 z" fill="#7c3aed"/><rect x="411" y="50" width="178" height="96" rx="14" fill="#fff" stroke="#c4b5fd"/><text x="500" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#1e1b4b" text-anchor="middle">Read the board</text><text x="500" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5b5675" text-anchor="middle">from the page’s own HTML</text><path d="M593 98 h5.5" stroke="#7c3aed" stroke-width="3"/><path d="M596.5 92 l8 6 l-8 6 z" fill="#7c3aed"/><rect x="606.5" y="50" width="178" height="96" rx="14" fill="#7c3aed" stroke="#c4b5fd"/><text x="695.5" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Pick the move</text><text x="695.5" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#ede9fe" text-anchor="middle">trap line, then threats</text><path d="M788.5 98 h5.5" stroke="#7c3aed" stroke-width="3"/><path d="M792 92 l8 6 l-8 6 z" fill="#7c3aed"/><rect x="802" y="50" width="178" height="96" rx="14" fill="#fff" stroke="#c4b5fd"/><text x="891" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#1e1b4b" text-anchor="middle">Light the square</text><text x="891" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5b5675" text-anchor="middle">then Make Move</text><text x="500" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#5b5675" text-anchor="middle">Everything runs inside your own tab. Nothing is sent anywhere, and the player makes every click.</text></svg>